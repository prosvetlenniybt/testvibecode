<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Валентинка — наши приключения</title>
  <style>
    :root{
      --paper:#f6f0df;
      --paper-2:#efe2c3;
      --ink:#2a1d12;
      --accent:#7a1f1f;
      --gold:#b08a2e;
      --shadow: rgba(42,29,18,.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(176,138,46,.16), transparent 55%),
        radial-gradient(900px 500px at 120% 10%, rgba(122,31,31,.12), transparent 55%),
        linear-gradient(180deg, var(--paper), var(--paper-2));
      font-family: ui-serif, "Georgia", "Times New Roman", serif;
      display:flex;
      justify-content:center;
      overflow:hidden;
    }

    .app{
      width:min(430px, 100%);
      height:100%;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
      position:relative;
    }

    .app::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(42,29,18,.05), transparent 35%),
        radial-gradient(circle at 70% 60%, rgba(42,29,18,.045), transparent 38%),
        radial-gradient(circle at 50% 90%, rgba(42,29,18,.03), transparent 40%);
      mix-blend-mode:multiply;
      pointer-events:none;
    }

    header{
      text-align:center;
      z-index:2;
    }

    .title{
      margin:4px 0 6px;
      font-size: clamp(20px, 5.2vw, 30px);
      line-height:1.2;
      font-weight:650;
    }

    .ornament{
      width:86%;
      margin:6px auto 0;
      height:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .ornament .line{
      height:1px;
      flex:1;
      background: linear-gradient(90deg, transparent, rgba(42,29,18,.4), transparent);
    }
    .ornament .dot{
      width:8px;height:8px;border-radius:999px;
      border:1px solid rgba(42,29,18,.5);
    }

    /* === КВАДРАТНЫЙ ФРЕЙМ 1:1 === */
    .frame{
      position:relative;
      width:100%;
      aspect-ratio:1/1;           /* ВСЕГДА 1:1 */
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(42,29,18,.18);
      box-shadow:0 16px 34px var(--shadow);
      background:rgba(246,240,223,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1;
    }

    .frame img{
      width:100%;
      height:100%;
      object-fit:cover;           /* квадратное заполнение */
      display:block;
    }

    /* декоративная виньетка (НЕ применяется к первому экрану) */
    .frame.decorated::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(100% 70% at 50% 30%, rgba(0,0,0,.0), rgba(0,0,0,.25)),
        linear-gradient(180deg, rgba(42,29,18,.15), transparent 35%, rgba(42,29,18,.18));
      pointer-events:none;
      opacity:.85;
    }

    /* Первый экран — без фона и без декоративной подложки */
    .frame.clean{
      background:transparent;
      border:none;
      box-shadow:none;
    }

    .bottom{
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index:2;
    }

    button{
      width:100%;
      border:none;
      border-radius:16px;
      padding:16px;
      font-size:18px;
      font-weight:650;
      color:var(--paper);
      background:linear-gradient(180deg, rgba(122,31,31,.95), rgba(90,18,18,.96));
      box-shadow:0 12px 22px rgba(42,29,18,.22);
      cursor:pointer;
    }

    button:active{
      transform:translateY(1px);
    }

    .progress{
      text-align:center;
      font-size:13px;
      opacity:.75;
    }

    .final{
      width:100%;
      aspect-ratio:1/1;
      border-radius:22px;
      border:1px solid rgba(42,29,18,.18);
      box-shadow:0 16px 34px var(--shadow);
      background:linear-gradient(180deg, rgba(246,240,223,.95), rgba(239,226,195,.95));
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
    }

    .final h2{
      margin:0;
      font-size: clamp(26px, 6vw, 38px);
      line-height:1.15;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title" id="title"></div>
      <div class="ornament">
        <span class="line"></span><span class="dot"></span><span class="line"></span>
      </div>
    </header>

    <div class="frame" id="frame">
      <img id="img" alt="" />
    </div>

    <div class="final" id="final">
      <h2>С днем Святого Валентина, солнышко!</h2>
    </div>

    <div class="bottom">
      <button id="btn"></button>
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <script>
    const steps = [
      {
        img: "sc0.webp",
        title: "В этой валентинке кроются наши миры и приключения",
        btn: "Открыть"
      },
      {
        img: "sc1.jpg",
        title: "Мы оседлали дракона",
        btn: "Вот это да!"
      },
      {
        img: "sc2.jpg",
        title: "Мы встретили грибное божество",
        btn: "Ого"
      },
      {
        img: "sc3.jpg",
        title: "Мы сражаемся против зомби",
        btn: "Что еще?)"
      },
      {
        img: "sc4.jpg",
        title: "Мы пьем чай во время извержения вулкана",
        btn: "Круто"
      }
    ];

    let i = 0;

    const titleEl = document.getElementById("title");
    const imgEl = document.getElementById("img");
    const btnEl = document.getElementById("btn");
    const progressEl = document.getElementById("progress");
    const frameEl = document.getElementById("frame");
    const finalEl = document.getElementById("final");

    function renderStep(index){
      const s = steps[index];

      titleEl.textContent = s.title;
      imgEl.src = s.img;
      imgEl.alt = s.title;
      btnEl.textContent = s.btn;

      // ВСЕГДА квадрат
      frameEl.classList.remove("clean");
      frameEl.classList.add("decorated");

      // Первый экран — убрать фон
      if(index === 0){
        frameEl.classList.add("clean");
        frameEl.classList.remove("decorated");
      }

      setProgress();
    }

    function showFinal(){
      frameEl.style.display = "none";
      finalEl.style.display = "flex";
      titleEl.textContent = "";
      btnEl.textContent = "Еще раз ❤️";
      progressEl.textContent = "";
    }

    btnEl.addEventListener("click", () => {
      if (i < steps.length - 1){
        i++;
        renderStep(i);
        return;
      }

      if (i === steps.length - 1 && frameEl.style.display !== "none"){
        showFinal();
        return;
      }

      i = 0;
      frameEl.style.display = "flex";
      finalEl.style.display = "none";
      renderStep(i);
    });

    renderStep(i);
  </script>
</body>
</html>
